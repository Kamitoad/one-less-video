<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="optionsDocumentTitle">OneLessVideo – Settings</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">OneLessVideo</p>
        <h1 data-i18n="settingsHeading">Settings</h1>
        <p class="intro" data-i18n="settingsIntro">
          Adjust the friction that appears before a new YouTube video.
        </p>
      </header>

      <form id="settings-form" novalidate inert aria-busy="true">
        <section>
          <h2 data-i18n="generalHeading">General</h2>
          <label class="switch-row" for="enabled">
            <input id="enabled" type="checkbox" />
            <span data-i18n="enableOneLessVideo">Enable OneLessVideo</span>
          </label>
        </section>

        <section>
          <h2 data-i18n="intentSectionHeading">Intention</h2>
          <label class="switch-row" for="require-reason">
            <input id="require-reason" type="checkbox" />
            <span data-i18n="askReason">Ask for a reason</span>
          </label>
          <label class="switch-row" for="require-intent">
            <input id="require-intent" type="checkbox" />
            <span data-i18n="requireIntentText">Require intention text</span>
          </label>
          <label class="number-row" for="minimum-intent-length">
            <span data-i18n="minimumCharacters">Minimum characters</span>
            <input
              id="minimum-intent-length"
              type="number"
              min="0"
              max="500"
              step="1"
            />
          </label>
        </section>

        <section>
          <h2 data-i18n="countdownSectionHeading">Countdown</h2>
          <div class="number-grid">
            <label class="number-row" for="countdown-min">
              <span data-i18n="minimumSeconds">Minimum (seconds)</span>
              <input
                id="countdown-min"
                type="number"
                min="0"
                max="120"
                step="1"
              />
            </label>
            <label class="number-row" for="countdown-max">
              <span data-i18n="maximumSeconds">Maximum (seconds)</span>
              <input
                id="countdown-max"
                type="number"
                min="0"
                max="120"
                step="1"
              />
            </label>
          </div>
        </section>

        <section>
          <h2 data-i18n="challengeSectionHeading">Challenge</h2>
          <label class="switch-row" for="require-challenge">
            <input id="require-challenge" type="checkbox" />
            <span data-i18n="requireTypingChallenge">
              Require typing challenge
            </span>
          </label>
          <label class="number-row" for="challenge-length">
            <span data-i18n="characters">Characters</span>
            <input
              id="challenge-length"
              type="number"
              min="3"
              max="12"
              step="1"
            />
          </label>
        </section>

        <section>
          <h2 data-i18n="antiMuscleMemoryHeading">Anti-muscle-memory</h2>
          <label class="switch-row" for="randomize-position">
            <input id="randomize-position" type="checkbox" />
            <span data-i18n="randomizeWatchPosition">
              Randomize the position of the final approval button
            </span>
          </label>
        </section>

        <div class="form-actions">
          <p
            id="status"
            class="status"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></p>
          <button class="primary" type="submit" data-i18n="saveSettings">
            Save settings
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
